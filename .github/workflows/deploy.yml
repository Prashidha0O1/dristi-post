name: Deploy to cPanel

# Push to main -> build a self-contained bundle in CI -> copy it to the server
# over SSH -> restart. Nothing is installed or built on the server (that is what
# CloudLinux keeps rejecting). The build needs no secrets: DATABASE_URL is set on
# the server, in cPanel > Setup Node.js App > Environment variables.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # next build type-checks on its own (and generates the LayoutProps/PageProps
      # types first), so a separate tsc step here just fails on missing types.
      - run: pnpm build

      # Standalone doesn't include static assets or public/ — copy them in next
      # to server.js so the bundle is complete.
      - name: Assemble bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.CPANEL_SSH_KEY }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.CPANEL_SSH_PORT }}" "${{ secrets.CPANEL_SSH_HOST }}" >> ~/.ssh/known_hosts

      # rsync isn't available on cPanel's jailed shell (it closes the connection),
      # so ship the bundle as a tar stream over SSH — only needs `tar` remotely.
      # .env, public/uploads and tmp aren't in the bundle, so they're untouched.
      - name: Deploy
        run: |
          tar czf - -C .next/standalone . \
            | ssh -p "${{ secrets.CPANEL_SSH_PORT }}" \
                "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
                "mkdir -p '${{ secrets.CPANEL_APP_PATH }}' && tar xzf - -C '${{ secrets.CPANEL_APP_PATH }}'"

      - name: Restart app
        run: |
          ssh -p "${{ secrets.CPANEL_SSH_PORT }}" \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "mkdir -p '${{ secrets.CPANEL_APP_PATH }}/tmp' && touch '${{ secrets.CPANEL_APP_PATH }}/tmp/restart.txt'"
