name: Deploy to cPanel (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cpanel-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose — pnpm's version comes from the
      # "packageManager" field in package.json (pnpm@10.14.0). Specifying both
      # makes action-setup fail with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Stable key so Server Action IDs stay identical across builds and
          # across Passenger workers. Without it every deploy bakes a fresh
          # random key and any already-open tab (or a second worker) gets
          # "Server Action ... was not found on the server." Set the SAME value
          # as a repo secret AND in the server's .env.
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.SERVER_ACTIONS_KEY }}

      - name: Assemble bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/tmp
          date +%s > .next/standalone/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          local-dir: ./.next/standalone/
          server-dir: ./
          exclude: |
            **/.env
            **/.env.*
            **/public/uploads/**
