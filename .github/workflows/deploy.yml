name: Build and publish deploy branch

# Push to main -> build the self-contained bundle in CI -> publish it to the
# `deploy` branch. cPanel Git Version Control then pulls `deploy` (outbound, so
# the host firewall never blocks it) and runs .cpanel.yml to copy the files into
# the app dir. No SSH/rsync from the runner; no build on the server.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: build-deploy-branch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Standalone doesn't include static assets or public/ — copy them in next
      # to server.js, and carry .cpanel.yml so the deploy branch is self-describing.
      - name: Assemble bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp .cpanel.yml .next/standalone/.cpanel.yml

      - name: Publish to deploy branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .next/standalone
          git init -q -b deploy
          git config user.email "ci@dristitimes"
          git config user.name "Deploy Bot"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          # Base the new commit on the existing deploy tip so the push
          # fast-forwards (cPanel pulls with --ff-only).
          if git ls-remote --exit-code "$REMOTE" refs/heads/deploy >/dev/null 2>&1; then
            git fetch -q --depth=1 "$REMOTE" deploy
            git reset -q --soft FETCH_HEAD
          fi
          git add -A
          git commit -q -m "deploy ${GITHUB_SHA}" || { echo "No changes to deploy."; exit 0; }
          git push -q "$REMOTE" HEAD:deploy
