name: Deploy to cPanel (FTP)

# Push to main -> build a self-contained bundle in CI -> upload it over FTP.
# FTP is used instead of SSH because the host firewall (Imunify360) blocks the
# GitHub runner IPs on SSH. The build needs no secrets; DATABASE_URL lives on
# the server in cPanel > Setup Node.js App > Environment variables.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-cpanel-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Standalone doesn't include static assets or public/ — copy them in next
      # to server.js. A fresh tmp/restart.txt each deploy nudges Passenger to
      # restart once the new files land.
      - name: Assemble bundle
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/tmp
          date +%s > .next/standalone/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # The FTP account is rooted at the app dir, so upload into its home.
          local-dir: ./.next/standalone/
          server-dir: ./
          # Never wipe these on the server (they're not in the bundle):
          exclude: |
            **/.env
            **/.env.*
            **/public/uploads/**
